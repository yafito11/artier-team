<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artier Team — Create Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../components/button.css">
  <link rel="stylesheet" href="../components/sidebar.css">
  <link rel="stylesheet" href="../components/form.css">
  <style>
    .page-header { display:flex; align-items:center; justify-content:space-between; padding:var(--space-4) var(--space-6); border-bottom:1px solid var(--color-border); flex-shrink:0; }
    .page-content { flex:1; overflow-y:auto; padding:var(--space-6); max-width:640px; margin:0 auto; width:100%; }
    .form-card { padding:var(--space-6); background:var(--color-bg-elevated); border:1px solid var(--color-border); border-radius:var(--radius-lg); }
    .form-card + .form-card { margin-top:var(--space-4); }
    .form-card-title { font-size:var(--font-size-md); font-weight:var(--font-weight-semibold); color:var(--color-fg-primary); margin-bottom:var(--space-4); }
  </style>
</head>
<body>
  <div class="app-layout">
        <aside class="sidebar" id="sidebar">
      <button class="sidebar-toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('collapsed')" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="sidebar-header">
        <button class="btn btn-secondary w-full" style="justify-content: flex-start; gap: var(--space-2);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>New Chat or Task</span>
        </button>
      </div>
      <div class="sidebar-search"><input type="text" placeholder="Search..."></div>
      <nav class="sidebar-content">
        <div class="sidebar-dropdown open">
          <button class="sidebar-dropdown-trigger" onclick="this.parentElement.classList.toggle('open')">
            <svg class="dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="dropdown-label">Recent Chat</span><span class="recent-count">3</span>
            <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sidebar-dropdown-content">
            <button class="sidebar-dropdown-item active"><svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="item-label">Email validation regex</span><span class="item-time">2m</span></button>
          </div>
        </div>
        <div class="sidebar-dropdown">
          <button class="sidebar-dropdown-trigger" onclick="this.parentElement.classList.toggle('open')">
            <svg class="dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span class="dropdown-label">Recent Task</span><span class="recent-count">1</span>
            <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="sidebar-dropdown-content">
            <button class="sidebar-dropdown-item"><svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="item-label">Build provider adapter</span><span class="item-time">30m</span></button>
          </div>
        </div>
        <div class="sidebar-section"><a href="agent-list.html" class="sidebar-nav-item"><svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="item-label">Agents</span><span class="item-count">5</span></a></div>
        <div class="sidebar-section"><a href="agent-team-org.html" class="sidebar-nav-item"><svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span class="item-label">Agent Teams</span><span class="item-count">2</span></a></div>
        <div class="sidebar-section"><a href="skill-list.html" class="sidebar-nav-item"><svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><span class="item-label">Skills</span><span class="item-count">3</span></a></div>
        <div class="sidebar-section"><a href="automation-list.html" class="sidebar-nav-item"><svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="item-label">Automations</span><span class="item-count">2</span></a></div>
      </nav>
      <div class="sidebar-mode-toggle"><button class="sidebar-mode-toggle-btn active">Chat</button><button class="sidebar-mode-toggle-btn">Task</button></div>
      <div class="sidebar-footer">
        <div class="user-avatar">Y</div><span class="user-name">Yafie</span>
        <button class="btn-icon sm btn-ghost"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div style="display:flex;align-items:center;gap:var(--space-3);">
          <button class="btn-icon sm btn-ghost">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
          <h2 style="font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold);">Create Agent</h2>
        </div>
      </div>

      <div class="page-content">
        <!-- Builder Mode Toggle -->
        <div class="radio-card-group" style="margin-bottom:var(--space-6);">
          <div class="radio-card selected">
            <div class="radio-card-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
            <div class="radio-card-title">Manual Form</div>
            <div class="radio-card-desc">Fill in the details yourself</div>
          </div>
          <div class="radio-card">
            <div class="radio-card-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <div class="radio-card-title">Agent Builder via Prompt</div>
            <div class="radio-card-desc">Describe what you need, AI generates it</div>
          </div>
        </div>

        <!-- Manual Form -->
        <div class="form-card">
          <div class="form-card-title">Basic Info</div>
          <div style="display:flex;flex-direction:column;gap:var(--space-4);">
            <div class="form-group">
              <label class="form-label">Name <span class="required">*</span></label>
              <input type="text" class="form-input" placeholder="e.g. Code Assistant">
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <input type="text" class="form-input" placeholder="Brief description of what this agent does">
            </div>
            <div class="form-group">
              <label class="form-label">Type</label>
              <div class="radio-card-group">
                <div class="radio-card selected">
                  <div class="radio-card-title">Standalone</div>
                  <div class="radio-card-desc">Independent agent</div>
                </div>
                <div class="radio-card">
                  <div class="radio-card-title">Team Lead</div>
                  <div class="radio-card-desc">Leads a team</div>
                </div>
                <div class="radio-card">
                  <div class="radio-card-title">Sub Agent</div>
                  <div class="radio-card-desc">Part of a team</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-card">
          <div class="form-card-title">Model Configuration</div>
          <div style="display:flex;flex-direction:column;gap:var(--space-4);">
            <div class="form-group">
              <label class="form-label">Provider</label>
              <select class="form-input form-select">
                <option>OpenRouter (OpenAI-compatible)</option>
                <option>Anthropic API</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Model</label>
              <select class="form-input form-select">
                <option>GPT-4o-mini</option>
                <option>GPT-4o</option>
                <option>Claude Sonnet</option>
                <option>Claude Opus</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-card">
          <div class="form-card-title">Instructions</div>
          <div class="form-group">
            <label class="form-label">System Prompt (Markdown)</label>
            <textarea class="form-input form-textarea" rows="8" placeholder="You are a helpful coding assistant. You help users write, debug, and review code..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-secondary">Cancel</button>
          <button class="btn btn-primary">Create Agent</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
